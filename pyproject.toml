[project]
name = "network-public-opinion-analyze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "xlrd>=2.0.2",
    "zhconv>=1.4.3",
]

# Windows 用 PyTorch 官方 CUDA 12.8 wheel，Mac 用 PyPI 上自带 MPS 的版本。
# 两台机器跑同一份 `uv sync` 即可装到对应平台的版本。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
